<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2f6b"/><stop offset="0.55" stop-color="#101a3a"/><stop offset="1" stop-color="#090d1c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.55"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="132" height="132" rx="30" fill="url(#tile)"/>
  <rect x="4.75" y="4.75" width="130.5" height="130.5" rx="29.25" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="70" cy="70" r="52" fill="url(#glow)"/>
  <!-- the globe: a ring, its meridian and its equator -->
  <circle cx="70" cy="70" r="33" fill="none" stroke="url(#ring)" stroke-width="6"/>
  <ellipse cx="70" cy="70" rx="14" ry="33" fill="none" stroke="#cfe6ff" stroke-opacity="0.85" stroke-width="3.2"/>
  <path d="M38 70 H102" stroke="#cfe6ff" stroke-opacity="0.85" stroke-width="3.2" stroke-linecap="round"/>
  <!-- the orbit, and what travels on it -->
  <path d="M24 94 C 44 56, 86 42, 113 44.5" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="113" cy="44.5" r="8.5" fill="#ffffff"/>
  <circle cx="113" cy="44.5" r="4" fill="#4f8cff"/>
</svg>
