name: Release (MGU Store catalog, iDrive 7 and iDrive 8)

# Publishes the release tagged "catalog": catalog.json and the three packages the MGU Store installs on iDrive 7 and iDrive 8.
# In the Store, add the source  waliworld/Beem-Net  and choose Releases.
# Runs when main changes in what goes into the release, or by hand (Actions, Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'src/**'
      - 'runtime/**'
      - 'tools/**'
      - 'assets/**'
      - 'test/id8/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The public app kit, at the commit tools/build_store.py pins
        run: |
          commit=$(python3 -c "import re;print(re.search(r\"KIT_COMMIT = '([0-9a-f]{40})'\", open('tools/build_store.py').read()).group(1))")
          git init -q "$RUNNER_TEMP/kit"
          git -C "$RUNNER_TEMP/kit" fetch -q --depth 1 https://github.com/cauliflowermossgrape/idrive7-apps.git "$commit"
          git -C "$RUNNER_TEMP/kit" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/kit" rev-parse HEAD)" = "$commit"

      - name: Tests (upstream's, and the placement on both screens)
        run: |
          node --test test/*.test.js test/id8/*.test.js
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/stage"
          MGU_KIT_DIR="$RUNNER_TEMP/kit" MGU_OUT="$RUNNER_TEMP/out" python3 tools/build_store.py --app mgu_browser \
            --version "$(python3 -c "import json;print(json.load(open('apps/mgu_browser/app.json'))['version'])")" \
            --source apps/mgu_browser --release-package --keep-stage "$RUNNER_TEMP/stage"
          node test/id8/layout_smoke.js "$RUNNER_TEMP/stage"

      - name: Build the release (dist/release/)
        run: python3 tools/release.py --kit "$RUNNER_TEMP/kit"

      - name: Keep Beta 2 as the release beta2 (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/beta2" >/dev/null 2>&1; then echo "beta2 is kept already"; exit 0; fi
          mkdir "$RUNNER_TEMP/beta2" && cd "$RUNNER_TEMP/beta2"
          gh release download catalog --repo "$GITHUB_REPOSITORY"
          grep -q '"version": "1.0.0"' catalog.json || { echo "the catalog is not Beta 2 (1.0.0): nothing kept"; exit 0; }
          sed -i 's#/releases/download/catalog/#/releases/download/beta2/#g' catalog.json
          gh release create beta2 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Beem-Net 1.0.0 - Beta 2 (kept to go back to)" \
            --notes "The packages of the release before Beta 3, kept unchanged (their source is commit 5a33747; this tag only holds the files). To use it, the MGU Store would need this release as the catalog; ask before going back." ./*

      - name: Publish it as the release "catalog"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Beem-Net 1.2.0 for iDrive 7 and iDrive 8 - Beta 4 (MGU Store catalog)"
          notes="Beta 4: your own Quick access - pin up to six pages to the start page from Bookmarks or History. Experimental. An internet browser for BMW iDrive 7 and iDrive 8, installed from the MGU Store: add the source waliworld/Beem-Net and choose Releases. Beta 3: faster (video sites are offered H.264 up to 30 fps, a smaller page picture with a Fast / Sharp setting, reduced motion), no more timeout messages when the page is busy, full width on iDrive 8, page zoom from 50 %, English everywhere in the app, a new logo and design. Beta 2 ran on a car; Beta 3 has not yet. The release before is kept as beta2. Use this source or upstream's on a car, not both."
          if gh release view catalog >/dev/null 2>&1; then
            gh release edit catalog --title "$title" --notes "$notes" --latest
          else
            gh release create catalog --target "$GITHUB_SHA" --title "$title" --notes "$notes" --latest
          fi
          gh release upload catalog dist/release/* --clobber
          ls -l dist/release
